<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minh Luân ❤️ Kim Chi</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(180deg,#081126,#162c72,#481756);
    color:#fff;
    width:100%;
    min-height:100vh;
    overflow:hidden;
}

/* Moon */

.moon{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    width:140px;
    height:140px;
    border-radius:50%;
    background:#fff4b5;
    box-shadow:
    0 0 50px #fff4b5,
    0 0 120px #ffd76a;
    animation:moonFloat 5s infinite ease-in-out;
}

@keyframes moonFloat{
    50%{
        transform:translateX(-50%) translateY(-8px);
    }
}

/* Lantern */

.lantern{
    position:absolute;
    font-size:42px;
    animation:swing 4s infinite ease-in-out;
}

.left{
    left:15px;
    top:90px;
}

.right{
    right:15px;
    top:90px;
}

@keyframes swing{
    50%{
        transform:translateY(-10px);
    }
}

/* Card */

.card{
    position:absolute;
    top:55%;
    left:50%;
    transform:translate(-50%,-50%);
    width:94%;
    max-width:700px;
    background:rgba(255,255,255,.1);
    border-radius:25px;
    backdrop-filter:blur(10px);
    padding:20px;
    text-align:center;
}

.title{
    font-size:clamp(24px,6vw,38px);
    color:#ffd76a;
    margin-bottom:10px;
}

.names{
    font-size:clamp(20px,5vw,30px);
    font-weight:bold;
    margin-bottom:10px;
}

.heart{
    font-size:70px;
    animation:beat 1s infinite;
}

@keyframes beat{
    50%{
        transform:scale(1.15);
    }
}

.message{
    margin-top:15px;
    background:rgba(255,255,255,.08);
    padding:15px;
    border-radius:15px;
    text-align:center;
    line-height:1.8;
    min-height:220px;
    font-size:clamp(15px,4vw,20px);
}

#typing::after{
    content:"|";
    color:#ffd76a;
    animation:blink .8s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

/* Audio */

audio{
    width:100%;
    margin-top:15px;
}

/* Button */

.musicBtn{
    margin-top:15px;
    padding:12px 20px;
    border:none;
    border-radius:20px;
    background:#ffd76a;
    color:#333;
    font-weight:bold;
    cursor:pointer;
}

/* Stars */

.star{
    position:absolute;
    border-radius:50%;
    background:white;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.3;}
    to{opacity:1;}
}

/* Hearts */

.float-heart{
    position:absolute;
    bottom:-50px;
    color:#ff6f9f;
    animation:rise 10s linear infinite;
}

@keyframes rise{
    0%{
        transform:translateY(0);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    100%{
        transform:translateY(-110vh);
        opacity:0;
    }
}

.footer{
    position:absolute;
    bottom:10px;
    width:100%;
    text-align:center;
    opacity:.8;
    font-size:13px;
}
</style>
</head>

<body>

<div class="moon"></div>

<div class="lantern left">🏮</div>
<div class="lantern right">🏮</div>

<div class="card">

    <div class="title">
        🌕 Chúc Mừng Trung Thu 🌕
    </div>

    <div class="names">
        Minh Luân ❤️ Kim Chi
    </div>

    <div class="heart">❤️</div>

    <div class="message">
        <span id="typing"></span>
    </div>

    <audio id="bgMusic" controls preload="metadata" loop>
        music.mp3
        Trình duyệt không hỗ trợ audio.
    </audio>

    <button class="musicBtn" onclick="toggleMusic()">
        🎵 Bật / Tắt Nhạc
    </button>

</div>

<div class="footer">
✨ Happy Mid-Autumn Festival ✨
</div>

<script>

/* Typing Text */

const text = `Kim Chi à,

Dưới ánh trăng rằm của mùa Trung Thu năm nay,
anh muốn gửi đến em những điều tốt đẹp nhất.

Cảm ơn em đã xuất hiện trong cuộc sống của anh,
mang đến niềm vui, sự bình yên và thật nhiều yêu thương.

Chúc em luôn hạnh phúc, mạnh khỏe,
rạng rỡ như ánh trăng đêm nay.

❤️ Minh Luân ❤️`;

let idx = 0;

function typeWriter(){

    const target =
    document.getElementById("typing");

    if(idx < text.length){

        if(text.charAt(idx) === "\n"){
            target.innerHTML += "<br>";
        }else{
            target.innerHTML += text.charAt(idx);
        }

        idx++;

        setTimeout(typeWriter,35);
    }
}

window.onload = () => {
    typeWriter();
};

/* Audio */

const audio =
document.getElementById("bgMusic");

let autoStarted = false;

async function startMusic(){

    if(autoStarted) return;

    try{

        await audio.play();

        autoStarted = true;

    }catch(err){

        console.log(err);

    }

}

document.addEventListener(
    "click",
    startMusic,
    { once:true }
);

document.addEventListener(
    "touchstart",
    startMusic,
    { once:true }
);

async function toggleMusic(){

    try{

        if(audio.paused){

            await audio.play();

        }else{

            audio.pause();

        }

    }catch(err){

        console.log(err);

    }

}

/* Stars */

for(let i=0;i<120;i++){

    let star=document.createElement("div");

    star.className="star";

    const size=Math.random()*3+1;

    star.style.width=size+"px";
    star.style.height=size+"px";

    star.style.left=Math.random()*100+"vw";
    star.style.top=Math.random()*100+"vh";

    document.body.appendChild(star);
}

/* Floating Hearts */

setInterval(()=>{

    let heart=document.createElement("div");

    heart.className="float-heart";

    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"vw";

    heart.style.fontSize=
    (18+Math.random()*22)+"px";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },10000);

},600);

</script>

</body>
</html>
