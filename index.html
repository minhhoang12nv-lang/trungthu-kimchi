<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minh Luân ❤️ Kim Chi</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:linear-gradient(to bottom,#080b2e,#1b2f7c,#45145a);
    color:white;
}

.moon{
    position:absolute;
    top:40px;
    left:50%;
    transform:translateX(-50%);
    width:180px;
    height:180px;
    border-radius:50%;
    background:#fff3b0;
    box-shadow:
        0 0 40px #fff3b0,
        0 0 100px #fff3b0,
        0 0 180px #ffd86b;
    animation:moonFloat 5s infinite ease-in-out;
}

@keyframes moonFloat{
    50%{
        transform:translateX(-50%) translateY(-10px);
    }
}

.lantern{
    position:absolute;
    font-size:60px;
    animation:swing 4s infinite ease-in-out;
}

.left{
    left:6%;
    top:100px;
}

.right{
    right:6%;
    top:100px;
    animation-delay:2s;
}

@keyframes swing{
    50%{
        transform:translateY(-15px);
    }
}

.card{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90%;
    max-width:900px;
    padding:30px;
    text-align:center;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(10px);
    border-radius:30px;
    z-index:10;
}

.title{
    font-size:40px;
    color:#ffd86b;
    margin-bottom:15px;
}

.names{
    font-size:30px;
    font-weight:bold;
    margin-bottom:20px;
}

.heart{
    font-size:100px;
    animation:beat 1s infinite;
}

@keyframes beat{
    50%{transform:scale(1.2);}
}

.message{
    margin-top:20px;
    padding:20px;
    line-height:1.9;
    font-size:20px;
    background:rgba(255,255,255,.08);
    border-radius:20px;
    min-height:320px;
}

#typing::after{
    content:"|";
    color:#ffd86b;
    animation:blink .8s infinite;
}

@keyframes blink{
    50%{opacity:0;}
}

.musicBtn{
    margin-top:15px;
    padding:14px 25px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
    background:#ffd86b;
    color:#222;
}

.star{
    position:absolute;
    border-radius:50%;
    background:white;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.3;}
    to{opacity:1;}
}

.float-heart{
    position:absolute;
    bottom:-50px;
    color:#ff7ca4;
    animation:rise 10s linear infinite;
}

@keyframes rise{
    0%{
        transform:translateY(0);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    100%{
        transform:translateY(-110vh);
        opacity:0;
    }
}

.footer{
    position:absolute;
    bottom:10px;
    width:100%;
    text-align:center;
    opacity:.7;
}
</style>
</head>

<body>

<div class="moon"></div>

<div class="lantern left">🏮</div>
<div class="lantern right">🏮</div>

<div class="card">

    <div class="title">
        🌕 Chúc Mừng Trung Thu 🌕
    </div>

    <div class="names">
        Minh Luân ❤️ Kim Chi
    </div>

    <div class="heart">
        ❤️
    </div>

    <div class="message">
        <span id="typing"></span>
    </div>

    <div style="margin-top:20px">
 
<audio
id="bgMusic"
controls
preload="metadata"
loop
style="
width:100%;
max-width:500px;
border-radius:10px;
">
 
music.mp3
 
Trình duyệt không hỗ trợ audio.
 
</audio>
 
</div>
    <button
        class="musicBtn"
        onclick="toggleMusic()">

        🎵 Bật / Tắt Nhạc

    </button>

</div>

<div class="footer">
✨ Happy Mid-Autumn Festival ✨
</div>

<script>

const text = `Kim Chi à ( Sến quá )

Dưới ánh trăng rằm sáng nhất của mùa Trung Thu, anh muốn gửi đến em những lời chúc chân thành và ngọt ngào nhất.

Cảm ơn em đã xuất hiện trong cuộc sống của anh, mang đến những nụ cười, những khoảnh khắc bình yên và thật nhiều yêu thương.

Anh mong rằng dù có bao nhiêu mùa trăng nữa đi qua, chúng ta vẫn luôn đồng hành bên nhau.

✨ Chúc em luôn vui vẻ, hạnh phúc và rạng rỡ như ánh trăng đêm nay. ✨

❤️ Yêu em rất nhiều ❤️

Minh Luân`;

let idx = 0;

function typeWriter(){

    const target =
    document.getElementById("typing");

    if(idx < text.length){

        if(text.charAt(idx) === "\n"){
            target.innerHTML += "<br>";
        }else{
            target.innerHTML += text.charAt(idx);
        }

        idx++;

        setTimeout(typeWriter,40);
    }
}

const audio =
document.getElementById("bgMusic");

let musicStarted = false;

async function startMusic(){

    if(musicStarted) return;

    try{

        await audio.play();

        musicStarted = true;

    }catch(err){

        console.log(err);

    }
}

document.addEventListener(
    "click",
    startMusic,
    { once:true }
);

document.addEventListener(
    "touchstart",
    startMusic,
    { once:true }
);

async function toggleMusic(){

    try{

        if(audio.paused){

            await audio.play();

        }else{

            audio.pause();

        }

    }catch(err){

        alert("Không tìm thấy file music.mp3");

        console.log(err);
    }
}

window.onload = () => {
    typeWriter();
};

/* Stars */
for(let i=0;i<150;i++){

    let star=document.createElement("div");

    star.className="star";

    let size=Math.random()*3+1;

    star.style.width=size+"px";
    star.style.height=size+"px";

    star.style.left=Math.random()*100+"vw";
    star.style.top=Math.random()*100+"vh";

    document.body.appendChild(star);
}

/* Floating Hearts */
setInterval(()=>{

    let h=document.createElement("div");

    h.className="float-heart";

    h.innerHTML="❤️";

    h.style.left=Math.random()*100+"vw";

    h.style.fontSize=
    (20+Math.random()*30)+"px";

    document.body.appendChild(h);

    setTimeout(()=>{
        h.remove();
    },10000);

},500);

</script><script>
const audio = document.getElementById("bgMusic");
let started = false;
 
async function autoPlayMusic(){
 
if(started) return;
 
try{
 
await audio.play();
 
started = true;
 
}catch(err){
 
console.log(err);
 
}
}
 
document.addEventListener(
"click",
autoPlayMusic,
{once:true}
);
 
document.addEventListener(
"touchstart",
autoPlayMusic,
{once:true}
);
 
async function toggleMusic(){
 
try{
 
if(audio.paused){
 
await audio.play();
 
}else{
 
audio.pause();
 
}
 
}catch(err){
 
console.log(err);
 
}
}
</script>

</body>
</html>
